name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.11.0"
        required: true

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - id: npm-package
        run: |
          echo "url=https://registry.npmjs.org/$(node -p 'const p = require("./server.json").packages[0]; `${p.identifier}/${p.version}`')" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_VERSION_URL: ${{ steps.npm-package.outputs.url }}
        run: |
          if curl -fsS -o /dev/null "$NPM_VERSION_URL"; then
            echo "Already on npm, nothing to publish."
          else
            npm publish --access public --provenance
          fi

      - name: Wait until npm serves the version
        env:
          NPM_VERSION_URL: ${{ steps.npm-package.outputs.url }}
        run: |
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null "$NPM_VERSION_URL" && exit 0
            sleep 15
          done
          echo "::error::$NPM_VERSION_URL still 404 after 10 minutes; the MCP Registry would reject the publish."
          exit 1

      - name: Publish to MCP Registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
